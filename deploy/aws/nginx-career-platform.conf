# Before Certbot. `certbot --nginx` edits the installed copy to add the 443
# server and the http -> https redirect. aws.dhwanijain.me is the test name;
# www is answered by Cloudflare's redirect rule and never reaches this server.
server {
    listen 80;
    server_name aws.dhwanijain.me dhwanijain.me;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
